name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/rguard
            GIT_SSH_COMMAND='ssh -i /root/.ssh/deploy_rguard' git pull origin main
            npm ci --production=false
            node scripts/apply-fresh-cases-data.mjs
            node scripts/apply-cases-videos-data.mjs
            node scripts/apply-articles-data.mjs
            node scripts/apply-rais-blogger-data.mjs
            node scripts/apply-natasha-blogger-data.mjs
            node scripts/apply-blogger-removals.mjs
            node scripts/apply-copy-fixes.mjs
            npm run build
            pm2 restart rguard
            echo "Deploy done at $(date)"
